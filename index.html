<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <meta
    name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes"
  >

  <title>Qurbani Run Practice</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      overscroll-behavior: none;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #unity-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
      outline: none;
    }

    #unity-loading-bar {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .unity-loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
    }

    .unity-spinner {
      width: 56px;
      height: 56px;
      border: 5px solid rgba(255, 255, 255, 0.18);
      border-top-color: #fff;
      border-radius: 999px;
      animation: unity-spin 0.8s linear infinite;
    }

    .unity-loading-text {
      max-width: 86vw;
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      font-weight: 600;
      color: #fff;
    }

    @keyframes unity-spin {
      to {
        transform: rotate(360deg);
      }
    }

    #unity-warning {
      position: fixed;
      top: 12px;
      left: 50%;
      z-index: 30;
      display: none;
      max-width: 90vw;
      transform: translateX(-50%);
      font-family: Arial, sans-serif;
      font-size: 14px;
      text-align: center;
    }

    #unity-warning div {
      margin-bottom: 6px;
      border-radius: 8px;
      color: #000;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div class="unity-loader-content">
        <div class="unity-spinner"></div>

        <div class="unity-loading-text">
          অনুগ্রহ করে সময় দিয়ে সহযোগিতা করবেন, গেমটি লোড হচ্ছে
        </div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");

    function resizeCanvas() {
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", function () {
      setTimeout(resizeCanvas, 250);
    });

    resizeCanvas();

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");

      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? "block" : "none";
      }

      var div = document.createElement("div");
      div.innerHTML = msg;

      if (type === "error") {
        div.style.background = "red";
        div.style.padding = "10px";
      } else {
        div.style.background = type === "warning" ? "yellow" : "white";
        div.style.padding = "10px";

        setTimeout(function () {
          if (div.parentNode === warningBanner) {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }
        }, 5000);
      }

      warningBanner.appendChild(div);
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/v3.loader.js";

    var config = {
      arguments: [],
      dataUrl: buildUrl + "/v3.data.br",
      frameworkUrl: buildUrl + "/v3.framework.js.br",
      codeUrl: buildUrl + "/v3.wasm.br",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Illusion Arc",
      productName: "Qurbani Run Practice",
      productVersion: "0.1.0",
      showBanner: unityShowBanner
    };

    window.unityInstance = null;

    loadingBar.style.display = "flex";

    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = function () {
      createUnityInstance(canvas, config, function () {
        /* Spinner only. No percentage text. */
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;
        loadingBar.style.display = "none";

        canvas.focus();

        console.log("[Qurbani Run Practice] Unity loaded without tournament session.");
      }).catch(function (message) {
        console.error("[Qurbani Run Practice] Unity load failed:", message);
        alert(message);
      });
    };

    script.onerror = function () {
      loadingBar.style.display = "none";
      alert("Failed to load the game. Please refresh and try again.");
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
